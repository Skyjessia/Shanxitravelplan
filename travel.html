<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的旅行｜人生足迹</title>

<style>

/* =========================
   基础
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f5f0;
    color: #333;
    line-height: 1.7;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================
   顶部 Hero
========================= */

.hero {
    padding: 70px 20px 55px;
    text-align: center;
    background: #ebe6dc;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 38px;
    font-weight: 500;
    letter-spacing: 2px;
}

.hero p {
    margin: 0;
    color: #777;
    font-size: 16px;
}


/* =========================
   页面主体
========================= */

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 55px 20px 80px;
}

.section-title {
    margin-bottom: 10px;
    font-size: 26px;
    font-weight: 500;
}

.section-intro {
    margin-top: 0;
    margin-bottom: 35px;
    color: #777;
}


/* =========================
   旅行卡片
========================= */

.trip-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 28px;
}

.trip-card {
    display: block;

    overflow: hidden;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.trip-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.10);
}


/* =========================
   图片
========================= */

.trip-image {
    height: 260px;

    background-position: center;
    background-size: cover;

    background-color: #ddd;
}


/* =========================
   卡片文字
========================= */

.trip-content {
    padding: 25px 25px 28px;
}

.trip-year {
    margin-bottom: 5px;

    color: #999;

    font-size: 14px;
    letter-spacing: 1px;
}

.trip-content h2 {
    margin: 0 0 6px;

    font-size: 25px;
    font-weight: 500;
}

.trip-destination {
    margin: 0 0 12px;

    color: #777;

    font-size: 15px;
}

.trip-description {
    margin: 0 0 18px;

    color: #666;

    font-size: 15px;
}

.trip-link {
    color: #8b7355;

    font-size: 14px;

    letter-spacing: 0.5px;
}


/* =========================
   地图区域
========================= */

.map-section {
    margin-top: 70px;
}

.map-box {
    min-height: 320px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #e9e5dc;

    border-radius: 14px;

    color: #999;

    text-align: center;
}

.map-box-inner {
    padding: 30px;
}

.map-icon {
    margin-bottom: 10px;

    font-size: 40px;
}

.map-title {
    margin-bottom: 5px;

    font-size: 20px;

    color: #777;
}

.map-description {
    margin: 0;

    font-size: 14px;

    color: #999;
}


/* =========================
   底部
========================= */

.footer {
    padding: 35px 20px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* =========================
   手机适配
========================= */

@media (max-width: 700px) {

    .hero {
        padding: 55px 20px 45px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .container {
        padding-top: 40px;
    }

    .trip-grid {
        grid-template-columns: 1fr;
    }

    .trip-image {
        height: 230px;
    }

}

</style>
</head>


<body>


<!-- =========================
     顶部
========================= -->

<header class="hero">

    <h1>我的旅行</h1>

    <p>
        走过的地方，留下的故事。
    </p>

</header>



<!-- =========================
     主体
========================= -->

<main class="container">


    <section>

        <h2 class="section-title">
            我的旅行足迹
        </h2>

        <p class="section-intro">
            这些旅行，是我人生走过的一些地方。
            未来，我会继续把它们一点一点记录下来。
        </p>


        <!--
            旅行卡片会由 data/trips.js
            自动生成
        -->

        <div
            class="trip-grid"
            id="tripGrid">
        </div>

    </section>



    <!-- =========================
         地图
    ========================= -->

    <section class="map-section">

        <h2 class="section-title">
            我的旅行地图
        </h2>

        <p class="section-intro">
            未来这里会成为一张属于我的旅行人生地图。
        </p>


        <div class="map-box">

            <div class="map-box-inner">

                <div class="map-icon">
                    🗺️
                </div>

                <div class="map-title">
                    旅行地图
                </div>

                <p class="map-description">
                    地图功能正在建设中
                </p>

            </div>

        </div>

    </section>


</main>



<!-- =========================
     页脚
========================= -->

<footer class="footer">

    我的旅行人生档案 · Shanxitravelplan

</footer>



<!-- =====================================================
     旅行数据
     
     非常重要：
     这个文件必须存在：
     
     data/trips.js
     
===================================================== -->

<script src="data/trips.js"></script>



<!-- =====================================================
     自动生成旅行卡片
===================================================== -->

<script>

const tripGrid =
    document.getElementById("tripGrid");


/*
 * 检查旅行数据是否成功加载
 */

if (
    typeof trips === "undefined" ||
    !Array.isArray(trips)
) {

    tripGrid.innerHTML = `

        <div style="
            grid-column: 1 / -1;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            text-align: center;
            color: #999;
        ">

            暂时没有读取到旅行数据。

            <br>

            请检查：

            <br><br>

            <strong>
                data/trips.js
            </strong>

            是否已经创建。

        </div>

    `;

}


/*
 * 自动生成旅行卡片
 */

else {

    trips.forEach(trip => {


        const card =
            document.createElement("a");


        card.className =
            "trip-card";


        /*
         * 点击卡片以后
         * 进入对应的回忆页面
         */

        card.href =
            trip.memoryPage || "#";


        card.innerHTML = `

            <div
                class="trip-image"
                style="
                    background-image:
                    url('${trip.cover}');
                "
            >
            </div>


            <div class="trip-content">


                <div class="trip-year">

                    ${trip.year}

                </div>


                <h2>

                    ${trip.title}

                </h2>


                <p class="trip-destination">

                    ${trip.destination}

                </p>


                <p class="trip-description">

                    ${trip.description || ""}

                </p>


                <div class="trip-link">

                    查看这次旅行 →

                </div>


            </div>

        `;


        tripGrid.appendChild(card);

    });

}

</script>


</body>

</html>
```
