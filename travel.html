<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的旅行｜人生足迹</title>


<style>

/* ========================================
   基础
======================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f5f0;

    color: #333;

    line-height: 1.7;
}


a {
    text-decoration: none;
    color: inherit;
}


/* ========================================
   顶部
======================================== */

.hero {

    padding: 70px 20px 55px;

    text-align: center;

    background: #ebe6dc;
}


.hero h1 {

    margin: 0 0 10px;

    font-size: 38px;

    font-weight: 500;

    letter-spacing: 2px;
}


.hero p {

    margin: 0;

    color: #777;

    font-size: 16px;
}


/* ========================================
   主体
======================================== */

.container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 55px 20px 80px;
}


.section-title {

    margin: 0 0 10px;

    font-size: 27px;

    font-weight: 500;
}


.section-intro {

    margin: 0 0 35px;

    color: #777;

    font-size: 15px;
}


/* ========================================
   旅行卡片区域
======================================== */

.trip-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 28px;
}


/* ========================================
   单张旅行卡片
======================================== */

.trip-card {

    overflow: hidden;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


.trip-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.10);
}


/* ========================================
   旅行图片
======================================== */

.trip-image {

    width: 100%;

    height: 260px;

    background-color: #ddd;

    background-position: center;

    background-size: cover;

    background-repeat: no-repeat;
}


/* ========================================
   卡片内容
======================================== */

.trip-content {

    padding: 25px 25px 27px;
}


.trip-year {

    margin-bottom: 5px;

    color: #999;

    font-size: 14px;

    letter-spacing: 1px;
}


.trip-content h2 {

    margin: 0 0 6px;

    font-size: 26px;

    font-weight: 500;
}


.trip-destination {

    margin: 0 0 12px;

    color: #777;

    font-size: 15px;
}


.trip-description {

    margin: 0 0 22px;

    color: #666;

    font-size: 15px;
}


/* ========================================
   两个入口
======================================== */

.trip-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.trip-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 42px;

    padding: 8px 15px;

    border-radius: 8px;

    font-size: 14px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


/* 攻略 */

.guide-button {

    background: #8b7355;

    color: #fff;
}


.guide-button:hover {

    background: #756044;

    transform: translateY(-1px);
}


/* 回忆 */

.memory-button {

    background: #eee9df;

    color: #6f5c46;
}


.memory-button:hover {

    background: #e3dccf;

    transform: translateY(-1px);
}


/* 没有攻略 */

.disabled-button {

    background: #f1f1f1;

    color: #aaa;

    cursor: default;
}


/* ========================================
   地图区域
======================================== */

.map-section {

    margin-top: 75px;
}


.map-box {

    min-height: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #e9e5dc;

    border-radius: 14px;

    color: #999;

    text-align: center;
}


.map-box-inner {

    padding: 30px;
}


.map-icon {

    margin-bottom: 10px;

    font-size: 42px;
}


.map-title {

    margin-bottom: 5px;

    color: #777;

    font-size: 20px;
}


.map-description {

    margin: 0;

    color: #999;

    font-size: 14px;
}


/* ========================================
   页脚
======================================== */

.footer {

    padding: 35px 20px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* ========================================
   手机
======================================== */

@media (max-width: 700px) {

    .hero {

        padding: 55px 20px 45px;
    }


    .hero h1 {

        font-size: 30px;
    }


    .container {

        padding-top: 40px;
    }


    .trip-grid {

        grid-template-columns: 1fr;
    }


    .trip-image {

        height: 230px;
    }


    .trip-actions {

        flex-direction: column;
    }


    .trip-button {

        width: 100%;
    }

}

</style>

</head>


<body>


<!-- ========================================
     顶部
======================================== -->

<header class="hero">

    <h1>我的旅行</h1>

    <p>
        走过的地方，留下的故事。
    </p>

</header>



<!-- ========================================
     主体
======================================== -->

<main class="container">


    <!-- ====================================
         旅行足迹
    ==================================== -->

    <section>

        <h2 class="section-title">
            我的旅行足迹
        </h2>

        <p class="section-intro">
            这些旅行，是我人生走过的一些地方。
            未来，我会继续把它们一点一点记录下来。
        </p>


        <!--
            这里不再手写旅行卡片。

            卡片会从：
            data/trips.js

            自动生成。
        -->

        <div
            class="trip-grid"
            id="tripGrid"
        ></div>

    </section>



    <!-- ====================================
         我的旅行地图
    ==================================== -->

    <section class="map-section">

        <h2 class="section-title">
            我的旅行地图
        </h2>

        <p class="section-intro">
            未来这里会成为一张属于我的旅行人生地图。
        </p>


        <div class="map-box">

            <div class="map-box-inner">

                <div class="map-icon">
                    🗺️
                </div>

                <div class="map-title">
                    旅行地图
                </div>

                <p class="map-description">
                    地图功能正在建设中
                </p>

            </div>

        </div>

    </section>


</main>



<!-- ========================================
     页脚
======================================== -->

<footer class="footer">

    我的旅行人生档案 · Shanxitravelplan

</footer>



<!-- ========================================
     读取旅行数据
======================================== -->

<script src="data/trips.js"></script>



<!-- ========================================
     自动生成旅行卡片
======================================== -->

<script>

const tripGrid =
    document.getElementById("tripGrid");


/* ----------------------------------------
   检查数据是否成功加载
---------------------------------------- */

if (
    typeof trips === "undefined" ||
    !Array.isArray(trips)
) {

    tripGrid.innerHTML = `

        <div style="
            grid-column: 1 / -1;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            text-align: center;
            color: #999;
        ">

            暂时没有读取到旅行数据。

            <br><br>

            请检查：

            <br>

            <strong>
                data/trips.js
            </strong>

            是否存在。

        </div>

    `;

}


/* ----------------------------------------
   自动生成旅行卡片
---------------------------------------- */

else {

    trips.forEach(trip => {


        /* 创建卡片 */

        const card =
            document.createElement("article");


        card.className =
            "trip-card";


        /* --------------------------------
           生成攻略按钮
        -------------------------------- */

        let guideButton = "";


        if (trip.guidePage) {

            guideButton = `

                <a
                    class="trip-button guide-button"
                    href="${trip.guidePage}"
                >
                    📖 旅游攻略
                </a>

            `;

        } else {

            guideButton = `

                <span
                    class="trip-button disabled-button"
                >
                    📖 攻略整理中
                </span>

            `;

        }


        /* --------------------------------
           生成回忆按钮
        -------------------------------- */

        let memoryButton = "";


        if (trip.memoryPage) {

            memoryButton = `

                <a
                    class="trip-button memory-button"
                    href="${trip.memoryPage}"
                >
                    🔐 我的回忆
                </a>

            `;

        }


        /* --------------------------------
           生成整个卡片
        -------------------------------- */

        card.innerHTML = `

            <div
                class="trip-image"
                style="
                    background-image:
                    url('${trip.cover}');
                "
            ></div>


            <div class="trip-content">


                <div class="trip-year">

                    ${trip.year}

                </div>


                <h2>

                    ${trip.title}

                </h2>


                <p class="trip-destination">

                    ${trip.destination}

                </p>


                <p class="trip-description">

                    ${trip.description || ""}

                </p>


                <div class="trip-actions">

                    ${guideButton}

                    ${memoryButton}

                </div>


            </div>

        `;


        tripGrid.appendChild(card);

    });

}

</script>


</body>

</html>
