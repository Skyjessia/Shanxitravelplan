<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的旅行｜人生足迹</title>


<style>

/* ========================================
   基础
======================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f5f0;

    color: #333;

    line-height: 1.7;
}


a {
    text-decoration: none;
    color: inherit;
}


/* ========================================
   顶部
======================================== */

.hero {

    padding: 70px 20px 55px;

    text-align: center;

    background: #ebe6dc;
}


.hero h1 {

    margin: 0 0 10px;

    font-size: 38px;

    font-weight: 500;

    letter-spacing: 2px;
}


.hero p {

    margin: 0;

    color: #777;

    font-size: 16px;
}


/* ========================================
   主体
======================================== */

.container {

    max-width: 1000px;

    margin: 0 auto;

    padding: 55px 20px 80px;
}


.section-title {

    margin: 0 0 10px;

    font-size: 27px;

    font-weight: 500;
}


.section-intro {

    margin: 0 0 35px;

    color: #777;

    font-size: 15px;
}


/* ========================================
   旅行卡片区域
======================================== */

.trip-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 28px;
}


/* ========================================
   单张旅行卡片
======================================== */

.trip-card {

    overflow: hidden;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


.trip-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.10);
}


/* ========================================
   旅行图片
======================================== */

.trip-image {

    width: 100%;

    height: 260px;

    background-color: #ddd;

    background-position: center;

    background-size: cover;

    background-repeat: no-repeat;
}


/* ========================================
   卡片内容
======================================== */

.trip-content {

    padding: 25px 25px 27px;
}


.trip-year {

    margin-bottom: 5px;

    color: #999;

    font-size: 14px;

    letter-spacing: 1px;
}


.trip-content h2 {

    margin: 0 0 6px;

    font-size: 26px;

    font-weight: 500;
}


.trip-destination {

    margin: 0 0 12px;

    color: #777;

    font-size: 15px;
}


.trip-description {
    margin: 0 0 22px;
    color: #666;
    font-size: 15px;
}


/* ========================================
   旅行地点
======================================== */

.trip-places {
    margin: 0 0 22px;
    color: #6f5c46;
    font-size: 14px;
}


.trip-places summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
}


.trip-places summary::-webkit-details-marker {
    display: none;
}


.trip-places summary::after {
    content: "＋";
    font-size: 13px;
    color: #999;
}


.trip-places[open] summary::after {
    content: "−";
}


.trip-place-list {
    margin-top: 12px;
    padding: 12px 15px;
    background: #f7f4ee;
    border-radius: 8px;
}


.trip-place-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    color: #666;
}


.place-dot {
    color: #a58b6b;
    font-size: 8px;
}

/* ========================================
   两个入口
======================================== */

.trip-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.trip-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 42px;

    padding: 8px 15px;

    border-radius: 8px;

    font-size: 14px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


/* 攻略 */

.guide-button {

    background: #8b7355;

    color: #fff;
}


.guide-button:hover {

    background: #756044;

    transform: translateY(-1px);
}


/* 回忆 */

.memory-button {

    background: #eee9df;

    color: #6f5c46;
}


.memory-button:hover {

    background: #e3dccf;

    transform: translateY(-1px);
}


/* 没有攻略 */

.disabled-button {

    background: #f1f1f1;

    color: #aaa;

    cursor: default;
}


/* ========================================
   地图区域
======================================== */

.map-section {

    margin-top: 75px;
}


.map-stats {

    display: flex;

    gap: 18px;

    flex-wrap: wrap;

    margin-bottom: 18px;

    color: #6f5c46;

    font-size: 15px;

    font-weight: 500;

}


.year-filter {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 18px;

}


.year-btn {

    display: inline-flex;

    align-items: center;

    min-height: 36px;

    padding: 6px 16px;

    border: none;

    border-radius: 8px;

    background: #eee9df;

    color: #6f5c46;

    font-size: 14px;

    font-family: inherit;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.year-btn:hover {

    background: #e3dccf;

    transform: translateY(-1px);

}


.year-btn.active {

    background: #8b7355;

    color: #fff;

}


.map-box {

    min-height: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #e9e5dc;

    border-radius: 14px;

    color: #999;

    text-align: center;
}


.map-box-inner {

    padding: 30px;
}


.map-icon {

    margin-bottom: 10px;

    font-size: 42px;
}


.map-title {

    margin-bottom: 5px;

    color: #777;

    font-size: 20px;
}


.map-description {

    margin: 0;

    color: #999;

    font-size: 14px;
}


/* ========================================
   页脚
======================================== */

.footer {

    padding: 35px 20px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* ========================================
   手机
======================================== */

@media (max-width: 700px) {

    .hero {

        padding: 55px 20px 45px;
    }


    .hero h1 {

        font-size: 30px;
    }


    .container {

        padding-top: 40px;
    }


    .trip-grid {

        grid-template-columns: 1fr;
    }


    .trip-image {

        height: 230px;
    }


    .trip-actions {

        flex-direction: column;
    }


    .trip-button {

        width: 100%;
    }

}

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>


<body>


<!-- ========================================
     顶部
======================================== -->

<header class="hero">

    <h1>我的旅行</h1>

    <p>
        走过的地方，留下的故事。
    </p>

</header>



<!-- ========================================
     主体
======================================== -->

<main class="container">


    <!-- ====================================
         旅行足迹
    ==================================== -->

    <section>

        <h2 class="section-title">
            我的旅行足迹
        </h2>

        <p class="section-intro">
            这些旅行，是我人生走过的一些地方。
            未来，我会继续把它们一点一点记录下来。
        </p>


        <!--
            卡片从数据银行自动生成：
            data/trips/ 目录 · 一个行程一份文件
            新增旅行见 data/bank.js 顶部 SOP
        -->

        <div
            class="trip-grid"
            id="tripGrid"
        ></div>

    </section>



    <!-- ====================================
         我的旅行地图
    ==================================== -->

    <section class="map-section">

        <h2 class="section-title">
            我的旅行地图
        </h2>

        <p class="section-intro">
            每一个点，都是我真正踩过的土地。
        </p>

        <div
            class="map-stats"
            id="mapStats"
        ></div>

        <div
            class="year-filter"
            id="yearFilter"
        ></div>

        <div
            id="worldMap"
            style="
                height: 520px;
                border-radius: 14px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.06);
                z-index: 0;
            "
        ></div>

    </section>


</main>



<!-- ========================================
     页脚
======================================== -->

<footer class="footer">

    我的旅行人生档案 · Shanxitravelplan

</footer>



<!-- ========================================
     读取旅行数据
======================================== -->

<script src="data/bank.js"></script>
<script src="data/trips/2020-xibei.js"></script>
<script src="data/trips/2026-russia.js"></script>
<script src="data/trips/2026-shanxi.js"></script>


<!-- ========================================
     自动生成旅行卡片
======================================== -->

<script>

const tripGrid =
    document.getElementById("tripGrid");


/* ----------------------------------------
   places 安全兜底：
   places.js 加载失败时不让页面崩掉
---------------------------------------- */

const safePlaces =
    (
        typeof PLACE_BANK !== "undefined" &&
        Array.isArray(PLACE_BANK)
    )
        ? PLACE_BANK
        : [];


/* ----------------------------------------
   检查数据是否成功加载
---------------------------------------- */

if (
    typeof TRIP_BANK === "undefined" ||
    !Array.isArray(TRIP_BANK)
) {

    tripGrid.innerHTML = `

        <div style="
            grid-column: 1 / -1;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            text-align: center;
            color: #999;
        ">

            暂时没有读取到旅行数据。

            <br><br>

            请检查：

            <br>

            <strong>
                data/trips.js
            </strong>

            是否存在。

        </div>

    `;

}


/* ----------------------------------------
   自动生成旅行卡片
---------------------------------------- */

else {

    /* 按年份降序排列（新的在前），同年按开始日期降序 */

        TRIP_BANK.sort((a, b) =>

            (b.year - a.year) ||

            String(b.startDate || "").localeCompare(String(a.startDate || ""))

        );


        TRIP_BANK.forEach(trip => {


        /* 创建卡片 */

        const card =
            document.createElement("article");


        card.className =
            "trip-card";


        /* --------------------------------
           生成攻略按钮
        -------------------------------- */

        let guideButton = "";


        if (trip.guidePage) {

            guideButton = `

                <a
                    class="trip-button guide-button"
                    href="${trip.guidePage}"
                >
                    📖 旅游攻略
                </a>

            `;

        } else {

            guideButton = `

                <span
                    class="trip-button disabled-button"
                >
                    📖 攻略整理中
                </span>

            `;

        }


        /* --------------------------------
           生成回忆按钮
        -------------------------------- */

        let memoryButton = "";


        if (trip.memoryPage) {

            memoryButton = `

                <a
                    class="trip-button memory-button"
                    href="${trip.memoryPage}"
                >
                    🔐 我的回忆
                </a>

            `;

        }


        /* --------------------------------
           生成整个卡片
        -------------------------------- */

        card.innerHTML = `

            <div
                class="trip-image"
                style="
                    background-image:
                    url('${trip.cover}');
                "
            ></div>


            <div class="trip-content">


                <div class="trip-year">

                    ${trip.year}

                </div>


                <h2>

                    ${trip.title}

                </h2>


                <p class="trip-destination">

                    ${trip.destination}

                </p>


                <p class="trip-description">

                    ${trip.description || ""}

                </p>
<details class="trip-places">

    <summary>
        📍 ${
            safePlaces.filter(
                place => place.tripId === trip.id
            ).length
        } 个地点
    </summary>

    <div class="trip-place-list">

        ${
            safePlaces
                .filter(
                    place => place.tripId === trip.id
                )
                .map(
                    place => `
                        <div class="trip-place-item">
                            <span class="place-dot">●</span>
                            <span>${place.name}</span>
                        </div>
                    `
                )
                .join("")
        }

    </div>

</details>

                <div class="trip-actions">

                    ${guideButton}

                    ${memoryButton}

                </div>


            </div>

        `;


        tripGrid.appendChild(card);

    });

}

</script>


<!-- ========================================
     点亮地图（Leaflet + 高德中文瓦片）
     国内🟠琥珀 / 国外🔵冷蓝 / 路过⚪灰虚线
======================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

if (typeof L !== "undefined") {

    /* ----------------------------------------
       初始化地图
    ---------------------------------------- */

    const worldMap = L.map("worldMap", {

        scrollWheelZoom: true,

        zoomControl: true,

        /* —— 缩放性能优化 —— */

        zoomSnap: 0.25,

        zoomDelta: 0.5,

        wheelPxPerZoomLevel: 140,

        updateWhenIdle: false,

        updateWhenZooming: false

    }).setView([42, 98], 3);


    L.tileLayer(

        "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",

        {

            subdomains: ["1", "2", "3", "4"],

            attribution: "© 高德地图",

            maxZoom: 18,

            /* —— 瓦片缓存优化：多缓存周边瓦片，往返缩放直接复用 —— */

            keepBuffer: 4

        }

    ).addTo(worldMap);


    /* ----------------------------------------
       tripId → year 映射（年份维度）
    ---------------------------------------- */

    const yearMap = {};


    if (
        typeof TRIP_BANK !== "undefined" &&
        Array.isArray(TRIP_BANK)
    ) {

        TRIP_BANK.forEach(trip => {

            yearMap[trip.id] = trip.year;

        });

    }


    /* ----------------------------------------
       渲染点亮（用 safePlaces 兜底）
    ---------------------------------------- */

    const allMarkers = [];


    safePlaces.forEach(place => {


        if (
            place.lat === undefined ||
            place.lng === undefined
        ) { return; }


        const isPassed =
            place.status === "passed";


        const isAbroad =
            place.country !== "中国";


        let dotColor = "#c08a68";

        if (isPassed) {

            dotColor = "#b8ad9a";

        } else if (isAbroad) {

            dotColor = "#7fa0b8";

        }


        const marker = L.circleMarker(

            [place.lat, place.lng],

            {

                radius: 7,

                color: dotColor,

                weight: 2.5,

                fillColor: dotColor,

                fillOpacity: isPassed ? 0.2 : 0.8,

                dashArray: isPassed ? "3 3" : null

            }

        ).addTo(worldMap);


        /* 弹出卡片 */

        const sitesText =
            place.sites && place.sites.length
                ? `<br><span style="color:#6f5c46">📍 ${place.sites.join(" · ")}</span>`
                : "";

        const noteText =
            place.note
                ? `<br><span style="color:#999;font-size:12px">${place.note}</span>`
                : "";

        const yearText =
            yearMap[place.tripId]
                ? `<span style="color:#999;font-size:12px"> · ${yearMap[place.tripId]}年</span>`
                : "";


        marker.bindPopup(`

            <div style="font-size:14px;line-height:1.6">

                <b>${place.city}</b>
                ${isPassed ? '<span style="color:#b8ad9a">（路过）</span>' : ""}

                <br>

                <span style="color:#999;font-size:12px">
                    ${place.country} · ${place.region}${yearText}
                </span>

                ${sitesText}
                ${noteText}

            </div>

        `);


        /* 收集 marker（年份筛选用） */

        allMarkers.push({

            marker: marker,

            place: place,

            year: yearMap[place.tripId],

            activeStyle: {

                radius: 7,

                color: dotColor,

                weight: 2.5,

                fillColor: dotColor,

                fillOpacity: isPassed ? 0.2 : 0.8,

                dashArray: isPassed ? "3 3" : null

            },

            dimStyle: {

                radius: 3.5,

                color: "#d8d2c4",

                weight: 1,

                fillColor: "#d8d2c4",

                fillOpacity: 0.15,

                dashArray: null

            }

        });

    });


    /* ----------------------------------------
       成就统计（按年 / 全部）
    ---------------------------------------- */

    function updateStats(year) {

        const list = allMarkers.filter(m =>
            year === "all" || m.year === year
        );


        const lit = list.filter(m =>
            m.place.status !== "passed"
        );


        const regions = new Set(
            lit.map(m => m.place.country + m.place.region)
        );

        const countries = new Set(
            lit.map(m => m.place.country)
        );


        let tripText = "";


        if (
            typeof TRIP_BANK !== "undefined" &&
            year !== "all"
        ) {

            const n =
                TRIP_BANK.filter(t => t.year === year).length;

            tripText = `<span>🧭 ${n} 次旅行</span>`;

        }


        const label =
            year === "all" ? "全部足迹" : `${year} 年`;


        const statsEl =
            document.getElementById("mapStats");


        if (statsEl) {

            statsEl.innerHTML = `

                <span><b>${label}</b></span>

                ${tripText}

                <span>🌍 ${countries.size} 国</span>

                <span>🗺️ ${regions.size} 个省级地区</span>

                <span>📍 ${lit.length} 城点亮</span>

            `;

        }

    }


    /* ----------------------------------------
       年份筛选条 + 飞行聚焦
    ---------------------------------------- */

    const filterEl =
        document.getElementById("yearFilter");


    if (filterEl) {

        const years =
            [...new Set(
                Object.values(yearMap)
            )].sort((a, b) => b - a);


        const buttons = [];


        function makeButton(label, value) {

            const btn =
                document.createElement("button");

            btn.className = "year-btn";

            btn.textContent = label;

            btn.dataset.value = value;

            filterEl.appendChild(btn);

            buttons.push(btn);

            return btn;

        }


        const btnAll =
            makeButton("全部足迹", "all");


        const yearButtons =
            years.map(y => makeButton(`${y}`, y));


        function select(value) {

            const bounds = [];


            allMarkers.forEach(m => {

                if (
                    value === "all" ||
                    m.year === value
                ) {

                    m.marker.setStyle(m.activeStyle);

                    bounds.push(
                        [m.place.lat, m.place.lng]
                    );

                } else {

                    m.marker.setStyle(m.dimStyle);

                }

            });


            buttons.forEach(b => {

                b.classList.toggle(
                    "active",
                    b.dataset.value === String(value)
                );

            });


            updateStats(value);


            if (
                value !== "all" &&
                bounds.length
            ) {

                worldMap.flyToBounds(
                    L.latLngBounds(bounds).pad(0.45),
                    { duration: 1.2 }
                );

            } else {

                worldMap.flyTo([42, 98], 3, {
                    duration: 1.2
                });

            }

        }


        btnAll.addEventListener(
            "click", () => select("all")
        );

        yearButtons.forEach((btn, i) => {

            btn.addEventListener(
                "click", () => select(years[i])
            );

        });


        /* 默认选中：全部 */

        select("all");

    } else {

        updateStats("all");

    }

}

</script>


</body>

</html>
